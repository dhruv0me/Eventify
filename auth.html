<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth - Eventify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .auth-card {
            max-width: 400px;
            margin: 100px auto;
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
        }

        .form-control {
            width: 100%;
            background: hsla(240, 6%, 10%, 0.8);
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            padding: 0.75rem;
            color: white;
            outline: none;
            transition: var(--transition-smooth);
        }

        .form-control:focus {
            border-color: hsl(var(--primary));
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.875rem;
            transition: var(--transition-smooth);
        }

        .tab-btn.active {
            border-color: hsl(var(--primary));
            color: hsl(var(--primary));
        }
    </style>
</head>

<body class="bg-gradient-hero" style="min-height: 100vh;">
    <nav class="glass-nav">
        <div class="container py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2" style="text-decoration: none;">
                <div class="glass flex items-center justify-center"
                    style="width: 32px; height: 32px; border-radius: 8px; background: var(--gradient-primary);">
                    <i data-lucide="sparkles" style="color: white; width: 18px; height: 18px;"></i>
                </div>
                <span class="text-gradient font-bold" style="font-size: 1.25rem;">Eventify</span>
            </a>
            <a href="index.html" class="btn btn-ghost">
                <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
                Back to Home
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="card auth-card">
            <div class="flex gap-4 mb-8" style="border-bottom: 1px solid hsl(var(--border));">
                <div id="login-tab" class="tab-btn active" onclick="Auth.setMode('login')">Login</div>
                <div id="register-tab" class="tab-btn" onclick="Auth.setMode('register')">Register</div>
            </div>

            <h2 id="auth-title" style="margin-bottom: 1.5rem;">Sign In</h2>

            <form id="auth-form">
                <div id="name-group" class="form-group" style="display: none;">
                    <label>Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-hero"
                    style="width: 100%; padding: 0.75rem; margin-top: 1rem;">
                    Continue
                </button>
            </form>

            <div id="error-msg"
                style="color: hsl(var(--destructive)); font-size: 0.875rem; margin-top: 1rem; text-align: center; display: none;">
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const Auth = {
            mode: 'login',

            setMode(mode) {
                this.mode = mode;
                document.getElementById('login-tab').classList.toggle('active', mode === 'login');
                document.getElementById('register-tab').classList.toggle('active', mode === 'register');
                document.getElementById('name-group').style.display = mode === 'register' ? 'block' : 'none';
                document.getElementById('auth-title').innerText = mode === 'login' ? 'Sign In' : 'Create Account';
                document.getElementById('submit-btn').innerText = mode === 'login' ? 'Sign In' : 'Sign Up';
            },

            async handleSubmit(e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const name = document.getElementById('name').value;
                const errorEl = document.getElementById('error-msg');
                const btn = document.getElementById('submit-btn');

                errorEl.style.display = 'none';
                btn.disabled = true;
                btn.innerText = 'Processing...';

                try {
                    const endpoint = this.mode === 'login' ? '/auth/login' : '/auth/register';
                    const payload = { email, password };
                    if (this.mode === 'register') payload.full_name = name;

                    const response = await fetch(`${API_URL}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (!response.ok) throw new Error(data.message || 'Something went wrong');

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';

                } catch (err) {
                    errorEl.innerText = err.message;
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = this.mode === 'login' ? 'Sign In' : 'Sign Up';
                }
            }
        };

        document.getElementById('auth-form').addEventListener('submit', (e) => Auth.handleSubmit(e));
    </script>
</body>

</html>
