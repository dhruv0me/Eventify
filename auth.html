<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Auth - Eventify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        .auth-card {
            max-width: 420px;
            margin: 80px auto;
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.875rem;
            transition: var(--transition-smooth);
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            color: var(--muted-foreground);
        }

        .tab-btn.active {
            border-bottom-color: var(--foreground);
            color: var(--foreground);
        }

        .pulse-beam-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 0;
        }
    </style>
</head>

<body class="bg-gradient-hero" style="min-height: 100vh;">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <nav class="glass-nav">
        <div class="container py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2" style="text-decoration: none;">
                <div
                    style="width:32px;height:32px;border-radius:8px;background:var(--foreground);display:flex;align-items:center;justify-content:center;">
                    <i data-lucide="sparkles" style="color:var(--background);width:18px;height:18px;"></i>
                </div>
                <span class="text-gradient font-bold" style="font-size:1.25rem;">Eventify</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="index.html" class="btn btn-ghost">
                    <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Back to Home
                </a>
                <div class="theme-toggle" title="Toggle theme"></div>
            </div>
        </div>
    </nav>

    <div class="container" style="position:relative;z-index:1;">
        <div class="card auth-card">
            <div class="flex gap-4 mb-8" style="border-bottom:1px solid var(--border);">
                <div id="login-tab" class="tab-btn active" onclick="Auth.setMode('login')">Login</div>
                <div id="register-tab" class="tab-btn" onclick="Auth.setMode('register')">Register</div>
            </div>
            <h2 id="auth-title" style="margin-bottom:1.5rem;">Sign In</h2>
            <form id="auth-form">
                <div id="name-group" class="form-group" style="display:none;">
                    <label>Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="pulse-beam-wrap">
                    <button type="submit" id="submit-btn" class="btn" style="width:100%;padding:0.85rem;">
                        Continue
                    </button>
                </div>
            </form>
            <div id="error-msg"
                style="color:var(--destructive);font-size:0.875rem;margin-top:1rem;text-align:center;display:none;">
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/shader-bg.js"></script>
    <script src="js/pulse-beams.js"></script>
    <script src="js/theme-toggle.js"></script>
    <script>
        const Auth = {
            mode: 'login',
            setMode(mode) {
                this.mode = mode;
                document.getElementById('login-tab').classList.toggle('active', mode === 'login');
                document.getElementById('register-tab').classList.toggle('active', mode === 'register');
                document.getElementById('name-group').style.display = mode === 'register' ? 'block' : 'none';
                document.getElementById('auth-title').innerText = mode === 'login' ? 'Sign In' : 'Create Account';
                document.getElementById('submit-btn').innerText = mode === 'login' ? 'Sign In' : 'Sign Up';
            },
            async handleSubmit(e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const name = document.getElementById('name').value;
                const errorEl = document.getElementById('error-msg');
                const btn = document.getElementById('submit-btn');
                errorEl.style.display = 'none';
                btn.disabled = true;
                btn.innerText = 'Processing...';
                try {
                    const endpoint = this.mode === 'login' ? '/auth/login' : '/auth/register';
                    const payload = { email, password };
                    if (this.mode === 'register') payload.full_name = name;
                    const response = await fetch(`${API_URL}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || 'Something went wrong');
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } catch (err) {
                    errorEl.innerText = err.message;
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = this.mode === 'login' ? 'Sign In' : 'Sign Up';
                }
            }
        };
        document.getElementById('auth-form').addEventListener('submit', (e) => Auth.handleSubmit(e));
    </script>
    <!-- Firebase SDK -->
    <script type="module" src="js/firebase-config.js"></script>
</body>

</html>
