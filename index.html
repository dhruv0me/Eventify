  <script type="text/babel" data-type="module">
    const { useState, useEffect, useCallback, createContext, useContext } = React;

    /* ═══════ CONTEXTS ═══════ */
    const AuthCtx = createContext(null);
    const ThemeCtx = createContext(null);

    function useAuth() { return useContext(AuthCtx); }
    function useTheme() { return useContext(ThemeCtx); }

    /* ═══════ AUTH PROVIDER ═══════ */
    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        return auth.onAuthStateChanged(async (u) => {
          setUser(u);
          if (u) {
            const doc = await db.collection('users').doc(u.uid).get();
            setProfile(doc.exists ? doc.data() : { email: u.email, name: u.displayName || 'User', role: 'user' });
          } else { setProfile(null); }
          setLoading(false);
        });
      }, []);

      const login = async (email, pass) => {
        const cred = await auth.signInWithEmailAndPassword(email, pass);
        return cred.user;
      };
      const register = async (email, pass, name) => {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await cred.user.updateProfile({ displayName: name });
        await db.collection('users').doc(cred.user.uid).set({ email, name, role: 'user', createdAt: new Date().toISOString() });
        setProfile({ email, name, role: 'user' });
        return cred.user;
      };
      const logout = () => { auth.signOut(); navigate('home'); };

      return <AuthCtx.Provider value={{ user, profile, loading, login, register, logout }}>{children}</AuthCtx.Provider>;
    }

    /* ═══════ THEME PROVIDER ═══════ */
    function ThemeProvider({ children }) {
      const [dark, setDark] = useState(() => localStorage.getItem('theme') !== 'light');
      useEffect(() => {
        document.body.className = dark ? 'dark' : 'light';
        localStorage.setItem('theme', dark ? 'dark' : 'light');
      }, [dark]);
      return <ThemeCtx.Provider value={{ dark, toggle: () => setDark(d => !d) }}>{children}</ThemeCtx.Provider>;
    }

    /* ═══════ ROUTER ═══════ */
    function navigate(page) { window.location.hash = '#' + page; }
    function useRoute() {
      const [route, setRoute] = useState(window.location.hash.slice(1) || 'home');
      useEffect(() => {
        const handler = () => setRoute(window.location.hash.slice(1) || 'home');
        window.addEventListener('hashchange', handler);
        return () => window.removeEventListener('hashchange', handler);
      }, []);
      return route;
    }

    /* ═══════ TOAST ═══════ */
    let toastTimer;
    function Toast({ msg, type, onClose }) {
      if (!msg) return null;
      const bg = type === 'error' ? 'bg-red-600' : 'bg-white text-black';
      return (
        <div className={`fixed bottom-6 right-6 z-[9999] px-5 py-3 rounded-xl font-semibold text-sm flex items-center gap-2 shadow-2xl toast-enter ${bg}`}>
          {msg}
        </div>
      );
    }

                  <button onClick={logout} className="px-3 py-2 rounded-lg text-sm font-medium border border-white/20 hover:bg-white/10 transition-all">Logout</button>
                </>

              <button onClick={toggle} className="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center hover:bg-white/10 transition-all" title="Toggle theme">
                <i data-lucide={dark ? 'moon' : 'sun'} className="w-4 h-4"></i>

            </div>
          </div>
        </nav>
      );
    }

    /* ═══════ AUTH PAGE ═══════ */
    function AuthPage() {
      const { user, login, register } = useAuth();
      const [mode, setMode] = useState('login');
      const [email, setEmail] = useState('');
      const [pass, setPass] = useState('');
      const [name, setName] = useState('');
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);

      useEffect(() => { if (user) navigate('dashboard'); }, [user]);

      const submit = async (e) => {
        e.preventDefault(); setErr(''); setBusy(true);
        try {
          if (mode === 'login') await login(email, pass);
          else await register(email, pass, name);
          navigate('dashboard');
        } catch (ex) { setErr(ex.message); }
        setBusy(false);
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 relative z-10">
          <div className="shape w-[400px] h-[400px] bg-white/10 -top-20 -left-20"></div>
          <div className="card-glow bg-surface rounded-2xl border border-white/10 p-8 w-full max-w-md anim-slide">
            <div className="flex border-b border-white/10 mb-6">
              {['login', 'register'].map(m => (
                <button key={m} onClick={() => setMode(m)} className={`flex-1 py-3 text-sm font-semibold capitalize transition-all border-b-2 ${mode === m ? 'border-current' : 'border-transparent text-gray-500'}`}>{m === 'login' ? 'Login' : 'Register'}</button>
              ))}
            </div>
            <h2 className="text-2xl font-bold mb-6">{mode === 'login' ? 'Sign In' : 'Create Account'}</h2>
            <form onSubmit={submit} className="space-y-4">
              {mode === 'register' && (
                <div>
                  <label className="block text-sm text-gray-400 mb-1">Full Name</label>
                  <input value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm" placeholder="John Doe" />
                </div>
              )}
              <div>
                <label className="block text-sm text-gray-400 mb-1">Email Address</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm" placeholder="name@example.com" />
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" required value={pass} onChange={e => setPass(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm" placeholder="••••••••" />
              </div>
              <button type="submit" disabled={busy} className="gbtn w-full py-3 rounded-xl font-semibold text-white">

                    <div className="flex items-center gap-2"><i data-lucide="calendar" className="w-3.5 h-3.5"></i>{ev.date}</div>
                    <div className="flex items-center gap-2"><i data-lucide="clock" className="w-3.5 h-3.5"></i>{ev.time}</div>
                    <div className="flex items-center gap-2"><i data-lucide="map-pin" className="w-3.5 h-3.5"></i>{ev.location}</div>
                    <div className="flex items-center gap-2"><i data-lucide="users" className="w-3.5 h-3.5"></i>{ev.teamSize || 'Solo'}</div>
                  </div>
                  <div className="flex items-center justify-between pt-4 border-t border-white/10">
                    <span className="text-xs font-semibold px-3 py-1 rounded-full bg-green-500/10 text-green-400 border border-green-500/20">{ev.status || 'Open'}</span>
                    <button onClick={() => handleRegister(ev)} className="gbtn px-4 py-2 rounded-xl text-xs font-semibold text-white">Register Now</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Registration Modal */}
          {modal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center" onClick={() => setModal(null)}>
              <div className="bg-surface rounded-2xl border border-white/10 p-8 w-full max-w-md" onClick={e => e.stopPropagation()}>
                <h3 className="font-bold text-lg mb-1">Register for {modal.title}</h3>
                <p className="text-sm text-gray-400 mb-5">Enter a team name if registering as a group.</p>
                <input value={teamName} onChange={e => setTeamName(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm mb-4" placeholder="Team Name (optional)" />
                <div className="flex gap-3">
                  <button onClick={confirmReg} className="gbtn flex-1 py-3 rounded-xl font-semibold text-white text-sm">Confirm</button>
                  <button onClick={() => setModal(null)} className="px-4 py-3 rounded-xl border border-white/10 text-sm font-medium hover:bg-white/5 transition-colors">Cancel</button>
                </div>
                {regErr && <p className="text-red-400 text-sm mt-3 text-center">{regErr}</p>}
              </div>
            </div>
          )}
          {toast && <Toast msg={toast} type="success" />}
        </div>
      );
    }

    /* ═══════ DASHBOARD PAGE ═══════ */
    function DashboardPage() {
      const { user, profile } = useAuth();
      const [regs, setRegs] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!user) { navigate('auth'); return; }
        db.collection('registrations').where('userId', '==', user.uid).get().then(snap => {
          setRegs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          setLoading(false);
        }).catch(() => setLoading(false));
      }, [user]);

      if (!user) return null;
      const avg = regs.length ? (regs.reduce((a, r) => a + (r.score || 0), 0) / regs.length).toFixed(1) : 'N/A';

      return (
        <div className="max-w-6xl mx-auto px-6 py-16 relative z-10 anim-slide">
          <h1 className="text-4xl font-extrabold mb-1">Welcome back, {profile?.name?.split(' ')[0] || 'User'}</h1>
          <p className="text-gray-400 mb-10">Manage your event registrations and scores.</p>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Sidebar */}
            <div className="space-y-6">
              <div className="bg-surface rounded-xl border border-white/10 p-6">
                <div className="w-16 h-16 rounded-full bg-current flex items-center justify-center mb-4">
                  <i data-lucide="user" className="w-8 h-8" style={{ color: 'var(--tw-prose-bg, #000)' }}></i>
                </div>
                <h3 className="font-bold text-lg">{profile?.name}</h3>
                <p className="text-sm text-gray-500">{profile?.email}</p>
                <span className="inline-block mt-3 px-3 py-1 text-xs font-semibold rounded-full bg-white/5 border border-white/10 uppercase">{profile?.role}</span>
              </div>
              <div className="bg-surface rounded-xl border border-white/10 p-6 space-y-3">
                <h4 className="font-semibold mb-2">Statistics</h4>
                <div className="flex justify-between text-sm py-2 border-b border-white/10"><span className="text-gray-500">Registered</span><span>{regs.length}</span></div>
                <div className="flex justify-between text-sm py-2"><span className="text-gray-500">Avg Score</span><span>{avg}</span></div>
              </div>
            </div>
            {/* Main */}
            <div className="md:col-span-2">
              <h3 className="font-bold text-lg mb-4">My Registrations</h3>
              {loading ? <p className="text-gray-500 anim-pulse">Loading your event passes...</p> :
                regs.length === 0 ? <p className="text-gray-500">No registrations yet. <a href="#events" className="underline">Discover events</a>.</p> :
                  <div className="space-y-3">
                    {regs.map(r => (
                      <div key={r.id} className="bg-surface rounded-xl border border-white/10 p-5 flex items-center justify-between flex-wrap gap-4 card-glow">
                        <div>
                          <h4 className="font-semibold">{r.eventTitle}</h4>
                          <div className="flex items-center gap-2 text-sm text-gray-500 mt-1">
                            <i data-lucide="tag" className="w-3.5 h-3.5"></i>
                            <span>{r.teamName || 'Solo Entry'}</span>
                            {r.teamCode && <span className="font-mono font-bold text-current">CODE: {r.teamCode}</span>}
                          </div>
                        </div>
                        <div className="text-right">
                          <span className="text-xs font-semibold px-3 py-1 rounded-full bg-white/8 border border-white/15">Score: {r.score}</span>
                          <p className="text-xs text-gray-600 mt-1">{new Date(r.registeredAt).toLocaleDateString()}</p>
                        </div>
                      </div>
                    ))}
                  </div>
              }
            </div>
          </div>
        </div>
      );
    }

    /* ═══════ ADMIN PAGE ═══════ */
    function AdminPage() {
      const { user, profile } = useAuth();
      const [tab, setTab] = useState('registrations');
      const [regs, setRegs] = useState([]);
      const [events, setEvents] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [toast, setToast] = useState({ msg: '', type: '' });
      const [form, setForm] = useState({ title: '', category: 'Technical', status: 'Open', description: '', date: '', time: '', location: '', teamSize: '', prizePool: '' });

      useEffect(() => {
        if (!user || profile?.role !== 'admin') { navigate('home'); return; }
        loadRegs(); loadEvents();
      }, [user, profile]);

      const loadRegs = async () => {
        const snap = await db.collection('registrations').get();
        setRegs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      };
      const loadEvents = async () => {
        const snap = await db.collection('events').get();
        setEvents(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      };
      const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast({ msg: '', type: '' }), 3000); };

      const updateScore = async (regId, score) => {
        await db.collection('registrations').doc(regId).update({ score: parseInt(score) });
        showToast('Score saved!'); loadRegs();
      };
      const toggleVis = async (evId, current) => {
        await db.collection('events').doc(evId).update({ is_visible: !current });
        showToast('Visibility updated!'); loadEvents();
      };
      const deleteEvent = async (evId) => {
        if (!confirm('Delete this event and all registrations?')) return;
        await db.collection('events').doc(evId).delete();
        const regSnap = await db.collection('registrations').where('eventId', '==', evId).get();
        const batch = db.batch();
        regSnap.forEach(d => batch.delete(d.ref));
        await batch.commit();
        showToast('Event deleted'); loadEvents(); loadRegs();
      };
      const createEvent = async (e) => {
        e.preventDefault();
        await db.collection('events').add({ ...form, is_visible: true, participants: 0, createdAt: new Date().toISOString() });
        showToast('Event created!'); setShowModal(false); setForm({ title: '', category: 'Technical', status: 'Open', description: '', date: '', time: '', location: '', teamSize: '', prizePool: '' }); loadEvents();
      };

      if (!user || profile?.role !== 'admin') return null;
      const uniqueUsers = new Set(regs.map(r => r.userEmail)).size;
      const visibleEvs = events.filter(e => e.is_visible).length;

      return (
        <div className="max-w-6xl mx-auto px-6 py-10 relative z-10 anim-slide">
          {/* Header */}
          <div className="flex items-start justify-between flex-wrap gap-4 mb-8">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-full bg-current flex items-center justify-center shadow-lg shadow-white/10">
                <i data-lucide="shield-check" className="w-5 h-5" style={{ color: '#000' }}></i>
              </div>
              <div><h1 className="text-2xl font-extrabold">Admin Control Center</h1><p className="text-sm text-gray-500">Full control over events, registrations & scoring</p></div>
            </div>
            <span className="text-xs font-semibold px-3 py-1 rounded-full bg-white/8 border border-white/15 uppercase flex items-center gap-1"><i data-lucide="shield" className="w-3 h-3"></i>ADMIN</span>
          </div>

          {/* Stats */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            {[
              { icon: 'ticket', color: 'rgb(167,139,250)', bg: 'rgba(147,51,234,.15)', label: 'Total Registrations', val: regs.length },
              { icon: 'calendar-check', color: 'rgb(249,168,212)', bg: 'rgba(219,39,119,.15)', label: 'Active Events', val: events.length },
              { icon: 'users', color: 'rgb(165,180,252)', bg: 'rgba(79,70,229,.15)', label: 'Participants', val: uniqueUsers },
              { icon: 'eye', color: 'rgb(74,222,128)', bg: 'rgba(34,197,94,.12)', label: 'Visible Events', val: visibleEvs },
            ].map((s, i) => (
              <div key={i} className="bg-surface rounded-xl border border-white/10 p-5 card-glow">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center mb-3" style={{ background: s.bg }}>
                  <i data-lucide={s.icon} className="w-5 h-5" style={{ color: s.color }}></i>
                </div>
                <div className="text-2xl font-extrabold">{s.val}</div>
                <div className="text-xs text-gray-500 uppercase tracking-wider font-medium">{s.label}</div>
              </div>
            ))}
          </div>

          {/* Tabs */}
          <div className="flex gap-1 bg-surface/60 border border-white/10 rounded-xl p-1 mb-8">
            {['registrations', 'events'].map(t => (
              <button key={t} onClick={() => { setTab(t); if (t === 'events') loadEvents(); else loadRegs(); }}
                className={`flex-1 py-2.5 rounded-lg text-sm font-semibold capitalize flex items-center justify-center gap-2 transition-all ${tab === t ? 'bg-current text-black shadow-lg' : 'text-gray-500 hover:bg-white/5'}`}>
                <i data-lucide={t === 'registrations' ? 'list' : 'calendar'} className="w-4 h-4"></i>
                {t === 'registrations' ? 'Registrations' : 'Manage Events'}
              </button>
            ))}
          </div>

          {/* Registrations Tab */}
          {tab === 'registrations' && (
            <div className="bg-surface rounded-xl border border-white/10 overflow-hidden">
              <div className="px-6 py-4 border-b border-white/5 flex justify-between items-center">
                <div><h3 className="font-bold">All Registrations</h3><p className="text-xs text-gray-500">Live participant data from Firestore</p></div>
                <button onClick={loadRegs} className="px-3 py-1.5 rounded-lg border border-white/10 text-xs font-medium hover:bg-white/5 flex items-center gap-1"><i data-lucide="refresh-cw" className="w-3 h-3"></i>Refresh</button>
              </div>
              {regs.length === 0 ? <div className="text-center py-12 text-gray-500">No registrations yet.</div> : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead><tr className="text-xs text-gray-500 uppercase tracking-wider">{['Participant', 'Event', 'Team', 'Code', 'Score', 'Action'].map(h => <th key={h} className="px-4 py-3 text-left font-semibold border-b border-white/5">{h}</th>)}</tr></thead>
                    <tbody>
                      {regs.map(r => (
                        <tr key={r.id} className="border-b border-white/[.03] hover:bg-white/[.03] transition-colors">
                          <td className="px-4 py-3"><div className="font-semibold">{r.userName}</div><div className="text-xs text-gray-500">{r.userEmail}</div></td>
                          <td className="px-4 py-3 font-semibold">{r.eventTitle}</td>
                          <td className="px-4 py-3">{r.teamName ? <span className="px-2 py-0.5 rounded-full text-xs bg-white/8 border border-white/15">{r.teamName}</span> : <span className="text-gray-600 text-xs">Solo</span>}</td>
                          <td className="px-4 py-3">{r.teamCode ? <code className="text-xs font-mono px-2 py-0.5 rounded bg-purple-500/10 text-purple-300">{r.teamCode}</code> : '—'}</td>
                          <td className="px-4 py-3"><input type="number" defaultValue={r.score || 0} id={`s-${r.id}`} min="0" className="w-16 px-2 py-1 rounded-lg bg-white/5 border border-white/10 text-center text-sm" /></td>
                          <td className="px-4 py-3 text-right"><button onClick={() => updateScore(r.id, document.getElementById(`s-${r.id}`).value)} className="gbtn px-3 py-1.5 rounded-lg text-xs font-semibold text-white">Save</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {/* Events Tab */}
          {tab === 'events' && (
            <div>
              <div className="flex justify-between items-center mb-4">
                <div><h3 className="font-bold">Event Library</h3><p className="text-xs text-gray-500">Toggle visibility or delete events</p></div>
                <button onClick={() => setShowModal(true)} className="gbtn px-4 py-2 rounded-xl text-sm font-semibold text-white flex items-center gap-2"><i data-lucide="plus" className="w-4 h-4"></i>Create Event</button>
              </div>
              {events.length === 0 ? <div className="text-center py-12 text-gray-500 bg-surface rounded-xl border border-white/10">No events created yet.</div> : (
                <div className="space-y-3">
                  {events.map(ev => (
                    <div key={ev.id} className={`bg-surface rounded-xl border border-white/10 p-5 flex items-center justify-between flex-wrap gap-4 card-glow ${!ev.is_visible ? 'opacity-50' : ''}`}>
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <span className="font-bold">{ev.title}</span>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${ev.is_visible ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}`}>{ev.is_visible ? 'VISIBLE' : 'HIDDEN'}</span>
                        </div>
                        <div className="flex flex-wrap gap-2 text-xs text-gray-500">
                          <span className="px-2 py-0.5 rounded-full bg-white/5 border border-white/5">{ev.category}</span>
                          <span className="px-2 py-0.5 rounded-full bg-white/5 border border-white/5">{ev.date}</span>
                          <span className="px-2 py-0.5 rounded-full bg-white/5 border border-white/5">{ev.location || 'TBA'}</span>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={() => toggleVis(ev.id, ev.is_visible)} className="px-3 py-1.5 rounded-lg border border-white/10 text-xs font-medium hover:bg-white/5">{ev.is_visible ? 'Hide' : 'Show'}</button>
                        <button onClick={() => deleteEvent(ev.id)} className="px-3 py-1.5 rounded-lg bg-red-600/20 text-red-400 border border-red-500/20 text-xs font-semibold hover:bg-red-600/30">Delete</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Create Event Modal */}
          {showModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center" onClick={() => setShowModal(false)}>
              <div className="bg-surface rounded-2xl border border-white/10 p-8 w-full max-w-lg max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-6">
                  <h3 className="font-bold text-lg">Create New Event</h3>
                  <button onClick={() => setShowModal(false)} className="p-1 hover:bg-white/10 rounded-lg"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={createEvent} className="space-y-4">
                  <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Title *</label><input required value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm" placeholder="HackFest 2026" /></div>
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Category</label><select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm"><option>Technical</option><option>Cultural</option><option>Gaming</option><option>Concert</option></select></div>
                    <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Status</label><select value={form.status} onChange={e => setForm({ ...form, status: e.target.value })} className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm"><option>Open</option><option>Filling Fast</option><option>Closed</option></select></div>
                  </div>
                  <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Description</label><textarea value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} rows="2" className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm" placeholder="Brief description..."></textarea></div>
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Date *</label><input required value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm" placeholder="March 25, 2026" /></div>
                    <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Time *</label><input required value={form.time} onChange={e => setForm({ ...form, time: e.target.value })} className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm" placeholder="10:00 AM" /></div>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Location *</label><input required value={form.location} onChange={e => setForm({ ...form, location: e.target.value })} className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm" placeholder="Auditorium A" /></div>
                    <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Team Size</label><input value={form.teamSize} onChange={e => setForm({ ...form, teamSize: e.target.value })} className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm" placeholder="3-5 members" /></div>
                  </div>
                  <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Prize Pool</label><input value={form.prizePool} onChange={e => setForm({ ...form, prizePool: e.target.value })} className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm" placeholder="₹50,000" /></div>
                  <div className="flex gap-3 pt-2">
                    <button type="submit" className="gbtn flex-1 py-3 rounded-xl font-semibold text-white">Save Event</button>
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-3 rounded-xl border border-white/10 text-sm font-medium hover:bg-white/5">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          )}
          {toast.msg && <Toast msg={toast.msg} type={toast.type} />}
        </div>
      );
    }

    /* ═══════ APP ═══════ */
    function App() {
      const route = useRoute();

      useEffect(() => {
        setTimeout(() => {
          if (window.lucide) lucide.createIcons();
          if (window.initGlowCards) window.initGlowCards();
          if (window.initPulseBeams) window.initPulseBeams();
        }, 200);
      });

      const Page = () => {
        switch (route) {
          case 'auth': return <AuthPage />;
          case 'events': return <EventsPage />;
          case 'dashboard': return <DashboardPage />;
          case 'admin': return <AdminPage />;
          default: return <HomePage />;
        }
      };

      return (
        <ThemeProvider>
          <AuthProvider>
            <Navbar />
            <Page />
          </AuthProvider>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <!-- Original Eventify visual effects -->
  <script src="js/shader-bg.js"></script>
  <script src="js/glow-cards.js"></script>
  <script src="js/pulse-beams.js"></script>
</body>

</html>
