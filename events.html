<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Eventify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .event-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: hsl(var(--muted-foreground));
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .event-detail i {
            width: 14px;
            height: 14px;
        }

        .registration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>

<body class="bg-gradient-hero" style="min-height: 100vh;">
    <!-- Decorative Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <nav class="glass-nav">
        <div class="container py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2" style="text-decoration: none;">
                <div class="glass flex items-center justify-center"
                    style="width: 32px; height: 32px; border-radius: 8px; background: var(--gradient-primary);">
                    <i data-lucide="sparkles" style="color: white; width: 18px; height: 18px;"></i>
                </div>
                <span class="text-gradient font-bold" style="font-size: 1.25rem;">Eventify</span>
            </a>

            <div class="flex items-center gap-4">
                <a href="index.html" class="btn btn-ghost">Home</a>
                <div id="auth-nav"></div>
            </div>
        </div>
    </nav>

    <div class="container py-16">
        <div class="text-center">
            <div class="badge badge-accent" style="margin-bottom: 1rem;">🎉 Upcoming Events Dashboard</div>
            <h1 style="font-size: 3rem; margin-bottom: 1rem;">Discover & Register</h1>
            <p class="text-muted">Explore a wide range of technical, cultural, and gaming events.</p>
        </div>

        <div id="events-list" class="events-grid">
            <!-- Events will be loaded here -->
            <div id="loading" class="text-center" style="grid-column: 1/-1; padding: 4rem;">
                <div class="animate-pulse">Loading amazing events...</div>
            </div>
        </div>
    </div>

    <!-- Registration Modal -->
    <div id="reg-modal" class="registration-overlay" onclick="EventsPage.closeModal(event)">
        <div class="card" style="width: 100%; max-width: 400px; padding: 2rem;" onclick="event.stopPropagation()">
            <h3 id="modal-title" style="margin-bottom: 1rem;">Register for Event</h3>
            <p class="text-sm text-muted" style="margin-bottom: 1.5rem;">Please enter a team name if you are registering
                as a group.</p>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label
                    style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">Team
                    Name (Optional)</label>
                <input type="text" id="team-name" class="form-control" placeholder="The Avengers">
            </div>

            <div class="flex gap-2">
                <button class="btn btn-hero" style="flex: 1;" onclick="EventsPage.confirmRegistration()">
                    <i data-lucide="check" style="width:15px;height:15px;"></i>
                    Confirm Registration
                </button>
                <button class="btn btn-outline" onclick="EventsPage.closeModal()">Cancel</button>
            </div>
            <div id="reg-error"
                style="color: hsl(var(--destructive)); font-size: 0.875rem; margin-top: 1rem; text-align: center; display: none;">
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/shader-bg.js"></script>
    <script>
        const EventsPage = {
            events: [],
            selectedEventId: null,

            async init() {
                try {
                    const response = await fetch(`${API_URL}/events`);
                    const data = await response.json();
                    this.events = data.events;
                    this.renderEvents();
                } catch (err) {
                    console.error('Failed to load events', err);
                    document.getElementById('events-list').innerHTML = '<div class="text-center" style="grid-column: 1/-1;">Failed to load events. Please try again later.</div>';
                }
            },

            renderEvents() {
                const list = document.getElementById('events-list');
                list.innerHTML = this.events.map(event => `
                    <div class="card">
                        <div class="flex items-center justify-between" style="margin-bottom: 1rem;">
                            <h3 style="font-size: 1.25rem;">${event.title}</h3>
                            <span class="badge" style="background: hsla(var(--primary) / 0.1); color: hsl(var(--primary)); border-color: hsla(var(--primary) / 0.2);">${event.category}</span>
                        </div>
                        <p class="text-sm text-muted" style="margin-bottom: 1.5rem;">${event.description}</p>
                        
                        <div style="margin-bottom: 1.5rem;">
                            <div class="event-detail"><i data-lucide="calendar"></i> <span>${event.date}</span></div>
                            <div class="event-detail"><i data-lucide="clock"></i> <span>${event.time}</span></div>
                            <div class="event-detail"><i data-lucide="map-pin"></i> <span>${event.location}</span></div>
                            <div class="event-detail"><i data-lucide="users"></i> <span>${event.participants} expected • ${event.teamSize}</span></div>
                        </div>

                        <div class="flex items-center justify-between" style="padding-top: 1rem; border-top: 1px solid hsla(0, 0%, 100%, 0.05);">
                            <span class="badge" style="background: hsla(142, 70%, 50%, 0.1); color: hsl(142, 70%, 50%); border-color: hsla(142, 70%, 50%, 0.2);">${event.status}</span>
                            <button class="btn btn-hero" onclick="EventsPage.handleRegister(${event.id}, '${event.category}')">
                                ${event.category === 'Concert' ? 'Get Pass' : 'Register Now'}
                            </button>
                        </div>
                    </div>
                `).join('');

                App.initLucide();
            },

            handleRegister(eventId, category) {
                if (!App.user) {
                    window.location.href = 'auth.html';
                    return;
                }

                if (category === 'Concert') {
                    this.selectedEventId = eventId;
                    this.confirmRegistration('');
                } else {
                    this.selectedEventId = eventId;
                    document.getElementById('reg-modal').style.display = 'flex';
                }
            },

            closeModal() {
                document.getElementById('reg-modal').style.display = 'none';
                document.getElementById('reg-error').style.display = 'none';
            },

            async confirmRegistration() {
                const teamName = document.getElementById('team-name').value;
                const errorEl = document.getElementById('reg-error');
                const token = localStorage.getItem('token');

                try {
                    const response = await fetch(`${API_URL}/events/register`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            event_id: this.selectedEventId,
                            team_name: teamName || null
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || 'Registration failed');

                    alert('Successfully registered!');
                    this.closeModal();
                    window.location.href = 'dashboard.html';

                } catch (err) {
                    errorEl.innerText = err.message;
                    errorEl.style.display = 'block';
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => EventsPage.init());
    </script>
</body>

</html>
