<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Eventify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .registration-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body class="bg-gradient-hero" style="min-height: 100vh;">
    <nav class="glass-nav">
        <div class="container py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2" style="text-decoration: none;">
                <div class="glass flex items-center justify-center"
                    style="width: 32px; height: 32px; border-radius: 8px; background: var(--gradient-primary);">
                    <i data-lucide="sparkles" style="color: white; width: 18px; height: 18px;"></i>
                </div>
                <span class="text-gradient font-bold" style="font-size: 1.25rem;">Eventify</span>
            </a>

            <div class="flex items-center gap-4">
                <a href="events.html" class="btn btn-ghost">Events</a>
                <button class="btn btn-outline" onclick="App.logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-16">
        <header style="margin-bottom: 3rem;">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;" id="greeting">Welcome back, Participant</h1>
            <p class="text-muted">Manage your event registrations and live scores here.</p>
        </header>

        <div class="dashboard-grid">
            <!-- Profile Column -->
            <aside class="flex flex-col gap-6">
                <div class="card">
                    <div
                        style="width: 64px; height: 64px; border-radius: 50%; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                        <i data-lucide="user" style="color: white; width: 32px; height: 32px;"></i>
                    </div>
                    <h3 id="profile-name">Full Name</h3>
                    <p class="text-sm text-muted" id="profile-email">email@example.com</p>
                    <div class="badge badge-accent mt-4" style="display: inline-block;">Gold Member</div>
                </div>

                <div class="card"
                    style="background: hsla(var(--primary) / 0.1); border-color: hsla(var(--primary) / 0.2);">
                    <h4 style="margin-bottom: 0.5rem;">Event Statistics</h4>
                    <div class="flex justify-between text-sm py-2"
                        style="border-bottom: 1px solid hsla(0, 0%, 100%, 0.05);">
                        <span class="text-muted">Registered</span>
                        <span id="stat-registered">0</span>
                    </div>
                    <div class="flex justify-between text-sm py-2">
                        <span class="text-muted">Average Score</span>
                        <span id="stat-score">N/A</span>
                    </div>
                </div>
            </aside>

            <!-- Registrations Column -->
            <main>
                <h3 style="margin-bottom: 1.5rem;">My Registrations</h3>
                <div id="registrations-list">
                    <!-- Registrations will be loaded here -->
                    <div class="animate-pulse text-muted">Loading your event passes...</div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const Dashboard = {
            registrations: [],

            async init() {
                if (!App.user) {
                    window.location.href = 'auth.html';
                    return;
                }

                document.getElementById('greeting').innerText = `Welcome back, ${App.user.full_name.split(' ')[0]}`;
                document.getElementById('profile-name').innerText = App.user.full_name;
                document.getElementById('profile-email').innerText = App.user.email;

                await this.fetchRegistrations();
            },

            async fetchRegistrations() {
                const token = localStorage.getItem('token');
                const list = document.getElementById('registrations-list');

                try {
                    const response = await fetch(`${API_URL}/user/registrations`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    const data = await response.json();
                    this.registrations = data.registrations;
                    this.renderRegistrations();
                    this.updateStats();
                } catch (err) {
                    console.error('Failed to load registrations', err);
                    list.innerHTML = '<p class="text-muted">You haven\'t registered for any events yet. Go to the <a href="events.html" style="color: hsl(var(--primary));">Events</a> page to start!</p>';
                }
            },

            renderRegistrations() {
                const list = document.getElementById('registrations-list');
                if (this.registrations.length === 0) {
                    list.innerHTML = '<p class="text-muted">No registrations found. Discover events <a href="events.html" style="color: hsl(var(--primary));">here</a>.</p>';
                    return;
                }

                list.innerHTML = this.registrations.map(reg => `
                    <div class="card registration-card">
                        <div class="flex flex-col gap-1">
                            <h4 style="font-size: 1.125rem;">${reg.event_title}</h4>
                            <div class="flex items-center gap-2 text-sm text-muted">
                                <i data-lucide="tag" style="width: 14px; height: 14px;"></i>
                                <span>${reg.team_name || 'Solo Entry'}</span>
                                ${reg.team_code ? `• <span style="font-family: monospace; color: hsl(var(--primary-glow)); font-weight: bold;">CODE: ${reg.team_code}</span>` : ''}
                            </div>
                        </div>
                        
                        <div class="flex flex-col items-end gap-2">
                            <span class="badge" style="background: hsla(263, 70%, 50%, 0.1); color: hsl(var(--primary)); border-color: hsla(263, 70%, 50%, 0.2);">
                                Score: ${reg.score}
                            </span>
                            <span class="text-xs text-muted">Registered at: ${new Date(reg.registered_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                `).join('');

                App.initLucide();
            },

            updateStats() {
                document.getElementById('stat-registered').innerText = this.registrations.length;
                const totalScore = this.registrations.reduce((acc, reg) => acc + (reg.score || 0), 0);
                const avgScore = this.registrations.length > 0 ? (totalScore / this.registrations.length).toFixed(1) : 'N/A';
                document.getElementById('stat-score').innerText = avgScore;
            }
        };

        document.addEventListener('DOMContentLoaded', () => Dashboard.init());
    </script>
</body>

</html>
