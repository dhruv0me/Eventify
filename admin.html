<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Eventify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .admin-container {
            padding-top: 4rem;
            padding-bottom: 4rem;
        }

        .tab-content {
            display: none;
            margin-top: 2rem;
        }

        .tab-content.active {
            display: block;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.875rem;
        }

        .admin-table th,
        .admin-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid hsl(var(--border));
        }

        .admin-table th {
            color: hsl(var(--muted-foreground));
            font-weight: 600;
        }

        .score-input {
            width: 60px;
            background: hsla(240, 6%, 10%, 0.8);
            border: 1px solid hsl(var(--border));
            border-radius: 4px;
            padding: 4px;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body class="bg-gradient-hero" style="min-height: 100vh;">
    <!-- Decorative Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <nav class="glass-nav">
        <div class="container py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2" style="text-decoration: none;">
                <div class="glass flex items-center justify-center"
                    style="width: 32px; height: 32px; border-radius: 8px; background: var(--gradient-primary);">
                    <i data-lucide="sparkles" style="color: white; width: 18px; height: 18px;"></i>
                </div>
                <span class="text-gradient font-bold" style="font-size: 1.25rem;">Eventify</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="btn btn-ghost">Dashboard</a>
                <button class="btn btn-outline" onclick="App.logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container admin-container">
        <header style="margin-bottom: 3rem;">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Admin Control Center</h1>
            <p class="text-muted">Manage events, participants, and update live scores.</p>
        </header>

        <div class="flex gap-4" style="border-bottom: 1px solid hsl(var(--border));">
            <button class="tab-btn active btn btn-ghost"
                onclick="Admin.setTab('registrations', event)">Registrations</button>
            <button class="tab-btn btn btn-ghost" onclick="Admin.setTab('events', event)">Manage Events</button>
        </div>

        <!-- Registrations Tab -->
        <div id="registrations-tab" class="tab-content active">
            <div class="card">
                <div class="flex justify-between items-center mb-4">
                    <h3>All Event Registrations</h3>
                    <button class="btn btn-outline btn-sm" onclick="Admin.loadRegistrations()">Refresh Data</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Participant</th>
                                <th>Event</th>
                                <th>Team</th>
                                <th>Code</th>
                                <th>Score</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="registrations-body">
                            <tr>
                                <td colspan="6" class="text-center">Loading registrations...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Manage Events Tab -->
        <div id="events-tab" class="tab-content">
            <div class="card">
                <div class="flex justify-between items-center mb-6">
                    <h3>Current Events</h3>
                    <button class="btn btn-hero" onclick="Admin.openCreateEventModal()">+ Create Event</button>
                </div>
                <div id="admin-events-list"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem;">
                    <!-- Events will be listed here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Create Event Modal -->
    <div id="event-modal" class="registration-overlay" onclick="Admin.closeEventModal(event)">
        <div class="card" style="width: 100%; max-width: 500px; padding: 2rem; max-height: 90vh; overflow-y: auto;"
            onclick="event.stopPropagation()">
            <h3 style="margin-bottom: 1.5rem;">Create New Event</h3>
            <form id="event-form" onsubmit="Admin.createEvent(event)">
                <div class="form-group">
                    <label
                        style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">Event
                        Title</label>
                    <input type="text" id="ev-title" class="form-control"
                        style="width: 100%; padding: 0.75rem; background: hsla(240, 6%, 10%, 0.8); border: 1px solid hsl(var(--border)); border-radius: var(--radius); color: white;"
                        required>
                </div>
                <div class="flex gap-4">
                    <div class="form-group" style="flex: 1; margin-bottom: 1.5rem;">
                        <label
                            style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">Category</label>
                        <select id="ev-category" class="form-control"
                            style="width: 100%; padding: 0.75rem; background: hsla(240, 6%, 10%, 0.8); border: 1px solid hsl(var(--border)); border-radius: var(--radius); color: white;">
                            <option value="Technical">Technical</option>
                            <option value="Cultural">Cultural</option>
                            <option value="Gaming">Gaming</option>
                            <option value="Concert">Concert</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1; margin-bottom: 1.5rem;">
                        <label
                            style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">Status</label>
                        <select id="ev-status" class="form-control"
                            style="width: 100%; padding: 0.75rem; background: hsla(240, 6%, 10%, 0.8); border: 1px solid hsl(var(--border)); border-radius: var(--radius); color: white;">
                            <option value="Open">Open</option>
                            <option value="Filling Fast">Filling Fast</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label
                        style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">Description</label>
                    <textarea id="ev-desc" class="form-control" rows="3"
                        style="width: 100%; padding: 0.75rem; background: hsla(240, 6%, 10%, 0.8); border: 1px solid hsl(var(--border)); border-radius: var(--radius); color: white;"></textarea>
                </div>
                <div class="flex gap-4">
                    <div class="form-group" style="flex: 1; margin-bottom: 1.5rem;">
                        <label
                            style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">Date</label>
                        <input type="text" id="ev-date" class="form-control" placeholder="March 25, 2025"
                            style="width: 100%; padding: 0.75rem; background: hsla(240, 6%, 10%, 0.8); border: 1px solid hsl(var(--border)); border-radius: var(--radius); color: white;"
                            required>
                    </div>
                    <div class="form-group" style="flex: 1; margin-bottom: 1.5rem;">
                        <label
                            style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">Time</label>
                        <input type="text" id="ev-time" class="form-control" placeholder="10:00 AM"
                            style="width: 100%; padding: 0.75rem; background: hsla(240, 6%, 10%, 0.8); border: 1px solid hsl(var(--border)); border-radius: var(--radius); color: white;"
                            required>
                    </div>
                </div>
                <div class="flex gap-4">
                    <div class="form-group" style="flex: 1; margin-bottom: 1.5rem;">
                        <label
                            style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">Location</label>
                        <input type="text" id="ev-loc" class="form-control"
                            style="width: 100%; padding: 0.75rem; background: hsla(240, 6%, 10%, 0.8); border: 1px solid hsl(var(--border)); border-radius: var(--radius); color: white;"
                            required>
                    </div>
                    <div class="form-group" style="flex: 1; margin-bottom: 1.5rem;">
                        <label
                            style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">Team
                            Size</label>
                        <input type="text" id="ev-teamsize" class="form-control" placeholder="Solo / 3-4 members"
                            style="width: 100%; padding: 0.75rem; background: hsla(240, 6%, 10%, 0.8); border: 1px solid hsl(var(--border)); border-radius: var(--radius); color: white;">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label
                        style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">Prize
                        Pool</label>
                    <input type="text" id="ev-prize" class="form-control" placeholder="₹50,000"
                        style="width: 100%; padding: 0.75rem; background: hsla(240, 6%, 10%, 0.8); border: 1px solid hsl(var(--border)); border-radius: var(--radius); color: white;">
                </div>

                <div class="flex gap-2 mt-6">
                    <button type="submit" class="btn btn-hero" style="flex: 1;">Save Event</button>
                    <button type="button" class="btn btn-outline" onclick="Admin.closeEventModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const Admin = {
            registrations: [],

            async init() {
                if (!App.user || App.user.role !== 'admin') {
                    window.location.href = 'index.html';
                    return;
                }
                await this.loadRegistrations();
            },

            setTab(tab, event) {
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

                document.getElementById(`${tab}-tab`).classList.add('active');
                event.target.classList.add('active');

                if (tab === 'registrations') this.loadRegistrations();
                if (tab === 'events') this.loadEvents();
            },

            async loadEvents() {
                const token = localStorage.getItem('token');
                try {
                    const response = await fetch(`${API_URL}/admin/events`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    this.renderEvents(data.events);
                } catch (err) {
                    console.error('Failed to load events', err);
                }
            },

            renderEvents(events) {
                const list = document.getElementById('admin-events-list');
                list.innerHTML = events.map(ev => `
                    <div class="card flex justify-between items-center" style="padding: 1rem; border-left: 4px solid ${ev.is_visible ? 'hsl(var(--primary))' : 'hsl(var(--muted))'};">
                        <div style="opacity: ${ev.is_visible ? '1' : '0.6'}">
                            <div class="font-bold">${ev.title} ${ev.is_visible ? '' : '<span class="text-xs text-muted">(Hidden)</span>'}</div>
                            <div class="text-xs text-muted">${ev.category} • ${ev.date} at ${ev.location}</div>
                        </div>
                        <div class="flex gap-2">
                            <button class="btn btn-outline btn-sm" onclick="Admin.toggleVisibility(${ev.id})">
                                <i data-lucide="${ev.is_visible ? 'eye-off' : 'eye'}" style="width: 14px; height: 14px;"></i>
                                ${ev.is_visible ? 'Hide' : 'Show'}
                            </button>
                            <button class="btn btn-outline btn-sm" style="color: hsl(var(--destructive));" onclick="Admin.deleteEvent(${ev.id})">
                                <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
                                Delete
                            </button>
                        </div>
                    </div>
                `).join('');
                App.initLucide();
            },

            async toggleVisibility(eventId) {
                const token = localStorage.getItem('token');
                try {
                    const response = await fetch(`${API_URL}/admin/events/toggle-visibility`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ event_id: eventId })
                    });
                    if (response.ok) this.loadEvents();
                } catch (err) {
                    alert('Failed to update visibility');
                }
            },

            async deleteEvent(eventId) {
                if (!confirm('Are you sure you want to PERMANENTLY remove this event and all its registrations?')) return;

                const token = localStorage.getItem('token');
                try {
                    const response = await fetch(`${API_URL}/admin/events/${eventId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (response.ok) {
                        alert('Event removed successfully');
                        this.loadEvents();
                    }
                } catch (err) {
                    alert('Failed to delete event');
                }
            },

            openCreateEventModal() {
                document.getElementById('event-modal').style.display = 'flex';
            },

            closeEventModal() {
                document.getElementById('event-modal').style.display = 'none';
            },

            async createEvent(e) {
                e.preventDefault();
                const token = localStorage.getItem('token');
                const payload = {
                    title: document.getElementById('ev-title').value,
                    category: document.getElementById('ev-category').value,
                    status: document.getElementById('ev-status').value,
                    description: document.getElementById('ev-desc').value,
                    date: document.getElementById('ev-date').value,
                    time: document.getElementById('ev-time').value,
                    location: document.getElementById('ev-loc').value,
                    teamSize: document.getElementById('ev-teamsize').value,
                    prizePool: document.getElementById('ev-prize').value
                };

                try {
                    const response = await fetch(`${API_URL}/admin/events`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        alert('Event created successfully!');
                        this.closeEventModal();
                        this.loadEvents();
                    }
                } catch (err) {
                    alert(err.message);
                }
            },

            async loadRegistrations() {
                const token = localStorage.getItem('token');
                try {
                    const response = await fetch(`${API_URL}/admin/registrations`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    this.registrations = data.registrations;
                    this.renderRegistrations();
                } catch (err) {
                    console.error('Admin Load Failed', err);
                }
            },

            renderRegistrations() {
                const body = document.getElementById('registrations-body');
                body.innerHTML = this.registrations.map(reg => `
                    <tr>
                        <td>
                            <div class="font-bold">${reg.user.name}</div>
                            <div class="text-xs text-muted">${reg.user.email}</div>
                        </td>
                        <td>${reg.event_title}</td>
                        <td>${reg.team_name || '<span class="text-muted">Solo</span>'}</td>
                        <td style="font-family: monospace;">${reg.team_code || '-'}</td>
                        <td>
                            <input type="number" class="score-input" value="${reg.score}" id="score-${reg.registration_id}">
                        </td>
                        <td>
                            <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="Admin.updateScore(${reg.registration_id})">Update</button>
                        </td>
                    </tr>
                `).join('');
            },

            async updateScore(regId) {
                const score = document.getElementById(`score-${regId}`).value;
                const token = localStorage.getItem('token');

                try {
                    const response = await fetch(`${API_URL}/admin/registrations/score`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ registration_id: regId, score: parseInt(score) })
                    });

                    if (response.ok) {
                        alert('Score updated!');
                        this.loadRegistrations();
                    } else {
                        throw new Error('Failed to update');
                    }
                } catch (err) {
                    alert(err.message);
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => Admin.init());
    </script>
</body>

</html>
